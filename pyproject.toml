[build-system]
requires = [
    'setuptools',
    'wheel',
    'setuptools-gettext',
    'translate-toolkit',
]
build-backend = 'setuptools.build_meta'

[project]
name = 'art-timelapse'
version = '3.19.0'
authors = [
    { name = 'cromachina' }
]
license = { file = 'LICENSE' }
description = 'Create timelapses of art programs.'
readme = 'README.md'
requires-python = '>=3.14'
dependencies = [
    'numpy',
    'opencv-python',
    'pillow',
    'psd_tools',
    'pynput',
    'pywinctl',
    'pywinbox',
    'watchdog',
    'mss',
    'psutil',
    'pymemoryeditor',
    'ttkbootstrap',
    'imageio-ffmpeg>=0.6',
    "windows-capture==2.0.1; sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.setuptools-gettext]
source_dir = 'po'
build_dir = 'build/lib/art_timelapse/locales'

[project.optional-dependencies]
dev = [
    'pyinstaller',
]

[project.urls]
'Homepage' = 'https://github.com/cromachina/art-timelapse'

[project.scripts]
art-timelapse = 'art_timelapse.gui:main'
sai2-recorder = 'sai_recorder.gui:main'
